name: Build patched ReHLDS i386

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout patch files
        uses: actions/checkout@v5

      - name: Build patched ReHLDS
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ubuntu:20.04 \
            bash -c '
              set -eux

              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y \
                build-essential \
                gcc \
                g++ \
                gcc-multilib \
                g++-multilib \
                libc6-dev \
                libc6-dev-i386 \
                cmake \
                curl \
                ca-certificates \
                patch \
                file \
                binutils

              echo "========================================"
              echo " Downloading ReHLDS 3.14.0.857"
              echo "========================================"

              rm -rf /work/rehlds
              mkdir -p /work/rehlds

              curl -L --fail \
                https://github.com/rehlds/ReHLDS/archive/refs/tags/3.14.0.857.tar.gz \
                | tar -xz -C /work/rehlds --strip-components=1

              cd /work/rehlds

              echo "========================================"
              echo " Applying FakeBot Auth patch"
              echo "========================================"

              patch -p1 --dry-run < /work/fakebot_status_v4.patch
              patch -p1 < /work/fakebot_status_v4.patch

              echo "========================================"
              echo " Building Linux i386 engine"
              echo "========================================"

              chmod +x build.sh

              ./build.sh \
                --compiler=gcc \
                --jobs=$(nproc) \
                -DUSE_STATIC_LIBSTDC=ON

              echo "========================================"
              echo " Checking engine"
              echo "========================================"

              test -f build/rehlds/engine_i486.so

              file build/rehlds/engine_i486.so

              echo "--- GLIBCXX ---"
              strings build/rehlds/engine_i486.so \
                | grep -o "GLIBCXX_[0-9.]*" \
                | sort -Vu || true

              echo "--- GLIBC ---"
              strings build/rehlds/engine_i486.so \
                | grep -o "GLIBC_[0-9.]*" \
                | sort -Vu || true
            '

      - name: Verify engine
        run: |
          test -f rehlds/build/rehlds/engine_i486.so
          file rehlds/build/rehlds/engine_i486.so

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: engine_i486-fakebot-auth
          path: rehlds/build/rehlds/engine_i486.so
          if-no-files-found: error
