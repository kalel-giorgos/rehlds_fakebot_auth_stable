name: Build patched ReHLDS i386

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow files
        uses: actions/checkout@v5

      - name: Build patched ReHLDS
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm -i \
            -v "$PWD:/work" \
            -w /work \
            ubuntu:20.04 bash -s <<'BASH'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y \
            build-essential \
            gcc g++ \
            gcc-multilib g++-multilib \
            libc6-dev libc6-dev-i386 \
            cmake curl ca-certificates \
            python3 file binutils

          echo "========================================"
          echo "Downloading ReHLDS 3.14.0.857"
          echo "========================================"

          rm -rf /work/rehlds
          mkdir -p /work/rehlds

          curl -L --fail \
            https://github.com/rehlds/ReHLDS/archive/refs/tags/3.14.0.857.tar.gz \
            | tar -xz -C /work/rehlds --strip-components=1

          cd /work/rehlds

          echo "========================================"
          echo "Applying FakeBot Status + Auth changes"
          echo "========================================"

          python3 <<'PYEDIT'
          from pathlib import Path

          host_path = Path("rehlds/engine/host_cmd.cpp")
          pr_path = Path("rehlds/engine/pr_cmds.cpp")

          host = host_path.read_text()
          pr = pr_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          marker = "SV_SAVEGAMECOMMENT_FUNC g_pSaveGameCommentFunc = &Host_SavegameComment;\n"
          helper = marker + r'''

// Stable fake Steam2 IDs for fake clients.
// Same bot name => same fake SteamID after reconnect/restart.
static char g_FakeBotSteamIds[MAX_CLIENTS][32];
static char g_FakeBotSteamIdFallback[32] = "STEAM_0:0:50000000";

static unsigned int Host_FakeBotFnv1a32(const char *text)
{
    unsigned int hash = 2166136261u;
    const unsigned char *p = (const unsigned char *)text;

    while (*p)
    {
        hash ^= (unsigned int)(*p++);
        hash *= 16777619u;
    }

    return hash;
}

const char *Host_GetFakeBotSteamId(client_t *client)
{
    int slot = (int)(client - g_psvs.clients);

    if (slot < 0 || slot >= MAX_CLIENTS)
        return g_FakeBotSteamIdFallback;

    unsigned int account = Host_FakeBotFnv1a32(client->name) & 0x7FFFFFFFu;

    if (account < 100000000u)
        account += 100000000u;

    unsigned int y = account & 1u;
    unsigned int z = account >> 1;

    Q_snprintf(
        g_FakeBotSteamIds[slot],
        sizeof(g_FakeBotSteamIds[slot]),
        "STEAM_0:%u:%u",
        y,
        z
    );

    return g_FakeBotSteamIds[slot];
}
'''
          host = replace_once(host, marker, helper, "insert helper")

          old_status = (
              '\t\tif (!client->fakeclient)\n'
              '\t\t\tval = SV_GetClientIDString(client);\n'
              '\t\telse val = "BOT";'
          )
          new_status = (
              '\t\tif (client->fakeclient)\n'
              '\t\t\tval = (char *)Host_GetFakeBotSteamId(client);\n'
              '\t\telse\n'
              '\t\t\tval = SV_GetClientIDString(client);'
          )
          host = replace_once(host, old_status, new_status, "Host_Status_f")

          old_formatted = (
              '#ifdef REHLDS_FIXES\n'
              '\t\t//TODO: I think it would be better if do the formatting for fakeclient as in Host_Status_f (in the original it there is no)\n'
              '\t\tif (client->fakeclient)\n'
              '\t\t\tszIDString = "BOT";\n'
              '\t\telse\n'
              '#endif // REHLDS_FIXES\n'
              '\t\tszIDString = SV_GetClientIDString(client);'
          )
          new_formatted = (
              '\t\tif (client->fakeclient)\n'
              '\t\t\tszIDString = (char *)Host_GetFakeBotSteamId(client);\n'
              '\t\telse\n'
              '\t\t\tszIDString = SV_GetClientIDString(client);'
          )
          host = replace_once(host, old_formatted, new_formatted, "Host_Status_Formatted_f")

          include_marker = '#include "precompiled.h"\n'
          include_new = (
              include_marker +
              '\n// Implemented in host_cmd.cpp.\n'
              'extern const char *Host_GetFakeBotSteamId(client_t *client);\n'
          )
          pr = replace_once(pr, include_marker, include_new, "pr_cmds extern")

          old_auth = (
              '\t\tif (cl->fakeclient)\n'
              '\t\t{\n'
              '\t\t\tQ_strcpy(szAuthID[count], "BOT");\n'
              '\t\t}'
          )
          new_auth = (
              '\t\tif (cl->fakeclient)\n'
              '\t\t{\n'
              '\t\t\tQ_strncpy(szAuthID[count], Host_GetFakeBotSteamId(cl), sizeof(szAuthID[count]) - 1);\n'
              '\t\t\tszAuthID[count][sizeof(szAuthID[count]) - 1] = 0;\n'
              '\t\t}'
          )
          pr = replace_once(pr, old_auth, new_auth, "PF_GetPlayerAuthId")

          host_path.write_text(host)
          pr_path.write_text(pr)

          print("FakeBot Status + Auth source changes applied successfully.")
          PYEDIT

          echo "========================================"
          echo "Building Linux i386 (single job for clean errors)"
          echo "========================================"

          chmod +x build.sh

          set +e
          ./build.sh --compiler=gcc --jobs=1 -DUSE_STATIC_LIBSTDC=ON 2>&1 | tee /work/build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "================ COMPILER ERRORS ================"
            grep -nEi \
              '(^|[^a-z])(error:|fatal error:|undefined reference|collect2:|ld: |make: \*\*\*)' \
              /work/build.log | tail -n 120 || true
            echo
            echo "================ LAST 250 LINES ================="
            tail -n 250 /work/build.log || true
            exit "$BUILD_STATUS"
          fi

          echo "========================================"
          echo "Checking generated engine"
          echo "========================================"

          test -f build/rehlds/engine_i486.so
          file build/rehlds/engine_i486.so

          echo "--- GLIBCXX references ---"
          strings build/rehlds/engine_i486.so | grep -o 'GLIBCXX_[0-9.]*' | sort -Vu || true

          echo "--- GLIBC references ---"
          strings build/rehlds/engine_i486.so | grep -o 'GLIBC_[0-9.]*' | sort -Vu || true
          BASH

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehlds-build-log
          path: build.log
          if-no-files-found: warn

      - name: Verify engine
        if: success()
        run: |
          test -f rehlds/build/rehlds/engine_i486.so
          file rehlds/build/rehlds/engine_i486.so

      - name: Upload engine
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: engine_i486-fakebot-auth-legacy
          path: rehlds/build/rehlds/engine_i486.so
          if-no-files-found: error
